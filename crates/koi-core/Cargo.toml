[package]
name = "koi-core"
description = "Core library of koi-music: YouTube Music access, playback, library and downloads"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
rustypipe = { version = "0.11.4", default-features = false, features = ["rustls-tls-webpki-roots"] }
rodio = { version = "0.23", default-features = false, features = ["playback", "mp4"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
directories = "6"
dirs = "7"
rand = "0.10"
souvlaki = { version = "0.9.3", default-features = false, features = ["use_zbus"] }
tokio-util = "0.7"
lofty = "0.25"

[dev-dependencies]
tempfile = "3"

[features]
test-util = []
