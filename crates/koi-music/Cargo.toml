[package]
name = "koi-music"
description = "A YouTube Music desktop player written in Rust"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
koi-core.workspace = true
tokio.workspace = true
tracing.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit", "persistence", "system_fonts", "clipboard"] }
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
egui_extras = { version = "0.37", features = ["http", "image", "webp"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
egui_dnd = "0.18"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
# wgpu renderer on Windows only (Direct3D 12, falls back to the WARP software renderer); Linux keeps glow.
eframe = { version = "0.37", default-features = false, features = ["wgpu"] }
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
