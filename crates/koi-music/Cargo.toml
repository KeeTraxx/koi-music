[package]
name = "koi-music"
description = "A YouTube Music desktop player written in Rust"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
koi-core.workspace = true
tokio.workspace = true
tracing.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit", "persistence", "system_fonts"] }
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
egui_extras = { version = "0.37", features = ["http", "image", "webp"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
egui_dnd = "0.18"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
