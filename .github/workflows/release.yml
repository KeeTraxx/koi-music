name: Release

# A pushed version tag (v1.2.3) builds the Windows binary and publishes a GitHub release.
# Running the workflow manually builds and packages the zip without publishing (dry run).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p koi-music

      - name: Package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          $name = "koi-music-$version-windows-x86_64"
          New-Item -ItemType Directory -Path "dist/$name" | Out-Null
          Copy-Item target/release/koi-music.exe, README.md, LICENSE -Destination "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          "ZIP=dist/$name.zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: koi-music-windows-x86_64
          path: ${{ env.ZIP }}

      - name: Publish release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" "$env:ZIP" --title "koi-music $env:GITHUB_REF_NAME" --generate-notes
