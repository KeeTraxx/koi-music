[workspace]
resolver = "3"
members = ["crates/koi-core", "crates/koi-music"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/KeeTraxx/koi-music"

[workspace.dependencies]
koi-core = { path = "crates/koi-core" }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process"] }
tracing = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev.package."*"]
opt-level = 2
